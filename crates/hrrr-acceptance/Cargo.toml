[package]
name = "hrrr-acceptance"
version = "0.1.0"
description = "Hermetic native acceptance stories for HRRR"
edition = "2024"
license = "MIT"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/hrrr"
rust-version = "1.96"
publish = false

[dependencies]
egui-tester = "0.8.0"
fast-mvt = { version = "0.6.2", default-features = false, features = ["writer"] }
geo-types = "0.7.20"
hrrr-contract = { path = "../hrrr-contract", version = "0.5.0" }
pmtiles = { version = "0.24.0", default-features = false, features = ["write"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[lints]
workspace = true
