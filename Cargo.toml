[workspace]
members = [
    "crates/hrrr-acceptance",
    "crates/hrrr-contract",
    "crates/hrrr-portability",
]
resolver = "3"

[package]
name = "hrrr"
version = "1.2.11"
edition = "2024"
license = "MIT"
rust-version = "1.96"
description = "A fast native HRRR forecast-field viewer"
readme = "README.md"
documentation = "https://docs.rs/hrrr"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/hrrr"
homepage = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/hrrr"
keywords = ["hrrr", "weather", "egui", "wgpu", "grib"]
categories = ["gui", "science::geo"]
include = ["assets/**", "build/**", "build.rs", "src/**", "README.md", "LICENSE"]

[features]
desktop-launcher = []
egui-test = ["dep:egui-tester-witness", "eternalist-apps/egui-test"]

[[bin]]
name = "HRRR"
path = "src/bin/desktop.rs"
required-features = ["desktop-launcher"]

[dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
bytes = "1.12.1"
crossbeam-channel = "0.5.16"
directories = "6.0.0"
brass_poolrooms = "0.13.18"
egui = "=0.36.1"
egui-wgpu = { version = "=0.36.1", default-features = false }
egui-tester-witness = { version = "0.9.7", optional = true, features = ["egui"] }
eternalist-apps = { version = "0.8.0", features = ["serde"] }
fast-mvt = { version = "0.6.2", default-features = false, features = ["reader"] }
geo-types = "0.7.20"
grib = { version = "0.17.1", default-features = false }
hrrr-contract = { path = "crates/hrrr-contract", version = "0.5.1" }
jiff = "0.2.35"
lyon_tessellation = "1.0.20"
pmtiles = { version = "0.24.0", default-features = false, features = ["http-async", "mmap-async-tokio", "reqwest-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["net", "rt", "time"] }
toml = "1.1.4"
ureq = "3.4.0"

[dev-dependencies]
fast-mvt = { version = "0.6.2", default-features = false, features = ["reader", "writer"] }
pmtiles = { version = "0.24.0", default-features = false, features = ["write"] }
tiny_http = "0.12.0"

[build-dependencies]
brass_foundry = "0.13.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1.1.9"
nix = { version = "0.31.3", default-features = false, features = ["poll"] }
tar = { version = "0.4.46", default-features = false }
x11rb = { version = "0.14.0", default-features = false, features = ["randr"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[workspace.lints.rust]
warnings = "deny"
elided_lifetimes_in_paths = "deny"
unexpected_cfgs = "deny"
unsafe_code = "deny"
unused_crate_dependencies = "warn"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_results = "deny"
ambiguous_glob_imports = "allow"
ambiguous_glob_reexports = "allow"
hidden_glob_reexports = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -3 }

dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"

cargo_common_metadata = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"

enum_glob_use = "allow"
wildcard_imports = "allow"

items_after_statements = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
unnested_or_patterns = "allow"

cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
implicit_hasher = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
uninlined_format_args = "allow"

ignored_unit_patterns = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
trivially_copy_pass_by_ref = "allow"
unused_async = "allow"
used_underscore_binding = "allow"

[package.metadata.rust-starter]
format_command = ["cargo", "fmt", "--all", "--check"]
clippy_command = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features"]
test_command = ["cargo", "test", "--locked", "--workspace", "--all-targets", "--all-features"]
doc_command = ["cargo", "doc", "--locked", "--workspace", "--all-features", "--no-deps"]
canonicalize_commands = [
  ["cargo", "fix", "--workspace", "--all-targets", "--all-features", "--allow-dirty", "--allow-staged", "--allow-no-vcs"],
  ["cargo", "clippy", "--fix", "--workspace", "--all-targets", "--all-features", "--allow-dirty", "--allow-staged", "--allow-no-vcs"],
  ["cargo", "fmt", "--all"],
]

[package.metadata.rust-starter.source_files]
max_lines = 3000
include = ["*.rs", "**/*.rs"]
exclude = []

[package.metadata.packager]
product-name = "HRRR"
identifier = "moe.swarm.hrrr"
publisher = "Eternalist"
category = "Weather"
icons = ["assets/hrrr-32.png", "assets/hrrr-128.png", "assets/hrrr-256.png", "assets/hrrr-512.png", "assets/hrrr-512@2x.png", "assets/hrrr.ico"]
binaries = [{ path = "HRRR", main = true }]
resources = ["LICENSE"]

[package.metadata.packager.macos]
minimum-system-version = "13.0"

[package.metadata.packager.nsis]
compression = "lzma"
installer-mode = "currentUser"
installer-icon = "assets/hrrr.ico"
languages = ["English"]
