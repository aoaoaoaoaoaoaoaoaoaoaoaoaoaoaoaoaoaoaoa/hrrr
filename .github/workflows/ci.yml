name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  source:
    name: Source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install declared toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Verify source
        run: scripts/check

  security:
    name: Locked dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install declared toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: scripts/audit

  package:
    name: Published package graph
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install declared toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify contract package
        if: startsWith(github.ref, 'refs/tags/hrrr-contract-v')
        run: cargo package --locked --package hrrr-contract
      - name: Verify crates.io packages
        if: ${{ !startsWith(github.ref, 'refs/tags/hrrr-contract-v') }}
        run: scripts/package

  portable-hosts:
    name: Runtime · ${{ matrix.name }}
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/hrrr-contract-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            executable: hrrr
          - name: macOS x86_64
            os: macos-15-intel
            executable: hrrr
          - name: Windows x86_64
            os: windows-2025
            executable: hrrr.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install declared toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Prove platform laws
        run: >-
          cargo test --locked
          --package hrrr
          --package hrrr-contract
          --package hrrr-portability
          --all-targets
          --all-features
      - name: Build witnessed product
        run: cargo build --release --locked --package hrrr --features egui-test
      - name: Prove native startup and first present
        env:
          HRRR_PORTABILITY_ARTIFACTS: ${{ runner.temp }}/hrrr-portability
        run: cargo run --release --locked --package hrrr-portability
      - name: Verify package graph
        run: cargo package --locked --package hrrr
      - name: Install ordinary product
        shell: bash
        run: cargo install --path . --root "$RUNNER_TEMP/hrrr-install" --locked --force
      - name: Prove installed CLI identity
        shell: bash
        run: '"$RUNNER_TEMP/hrrr-install/bin/${{ matrix.executable }}" --version'
      - name: Uninstall ordinary product
        shell: bash
        run: |
          cargo uninstall --root "$RUNNER_TEMP/hrrr-install" hrrr
          test ! -e "$RUNNER_TEMP/hrrr-install/bin/${{ matrix.executable }}"
      - name: Retain portability evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hrrr-portability-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/hrrr-portability
          if-no-files-found: ignore
          retention-days: 7

  lifecycle:
    name: Install and uninstall · Linux/X11
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/hrrr-contract-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native test substrate
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            bubblewrap \
            dbus-user-session \
            libxkbcommon-x11-0 \
            mesa-vulkan-drivers \
            xauth \
            xvfb
      - name: Admit contained user services
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          runtime="/run/user/$(id -u)"
          test -S "$runtime/bus"
          printf 'XDG_RUNTIME_DIR=%s\n' "$runtime" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime" >> "$GITHUB_ENV"
      - name: Normalize software Vulkan
        run: |
          root="$RUNNER_TEMP/egui-tester-lavapipe"
          library=$(find /usr/lib -name libvulkan_lvp.so -print -quit)
          manifest=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -f "$library"
          test -f "$manifest"
          install -d "$root/usr/lib" "$root/usr/share/vulkan/icd.d"
          ln -s "$library" "$root/usr/lib/libvulkan_lvp.so"
          install -m 0644 "$manifest" "$root/usr/share/vulkan/icd.d/lvp_icd.json"
          printf 'EGUI_TESTER_LAVAPIPE=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Install declared toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify installation lifecycle
        env:
          HRRR_INSTALL_ARTIFACTS: /tmp/hrrr-install-artifacts
        run: scripts/verify-install
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hrrr-install-${{ github.run_id }}
          path: /tmp/hrrr-install-artifacts
          if-no-files-found: ignore
          retention-days: 7

  native-acceptance:
    name: Native acceptance · Linux/X11
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/hrrr-contract-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install declared toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install native test substrate
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bubblewrap \
            dbus-user-session \
            i3-wm \
            libxkbcommon-x11-0 \
            mesa-vulkan-drivers \
            xauth \
            xvfb
      - name: Admit contained user services
        run: |
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          runtime="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="$runtime"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
          systemctl --user show-environment
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Normalize software Vulkan
        run: |
          root="$HOME/.local/share/x11-gui-testing/lavapipe"
          library=$(find /usr/lib -name libvulkan_lvp.so -print -quit)
          manifest=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$library"
          test -n "$manifest"
          mkdir -p "$root/usr/lib" "$root/usr/share/vulkan/icd.d"
          ln -s "$library" "$root/usr/lib/libvulkan_lvp.so"
          cp "$manifest" "$root/usr/share/vulkan/icd.d/lvp_icd.json"
      - name: Verify native user stories
        env:
          HRRR_ACCEPTANCE_ARTIFACTS: /tmp/hrrr-acceptance-artifacts
        run: scripts/test-gui
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hrrr-x11-${{ github.run_id }}
          path: /tmp/hrrr-acceptance-artifacts
          if-no-files-found: ignore
          retention-days: 7

  installer-macos:
    name: Installer · macOS universal
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/hrrr-contract-v')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Bind disposable package roots
        run: |
          printf 'CARGO_TARGET_DIR=%s/hrrr-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HRRR_PACKAGE_DIR=%s/hrrr-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'HRRR_PORTABILITY_ARTIFACTS=%s/hrrr-packaged-portability\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install declared toolchain and universal targets
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install pinned packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Forge, mount, and prove DMG
        run: scripts/package-macos
      - name: Retain installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hrrr-installer-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/hrrr-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hrrr-installer-macos-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/hrrr-packaged-portability
          if-no-files-found: ignore
          retention-days: 7

  installer-windows:
    name: Installer · Windows x86_64
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/hrrr-contract-v')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Bind disposable package roots
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP\hrrr-target" >> $env:GITHUB_ENV
          "HRRR_PACKAGE_DIR=$env:RUNNER_TEMP\hrrr-release" >> $env:GITHUB_ENV
          "HRRR_PORTABILITY_ARTIFACTS=$env:RUNNER_TEMP\hrrr-packaged-portability" >> $env:GITHUB_ENV
      - name: Install declared toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install pinned packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Forge, install, and prove NSIS package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Retain installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hrrr-installer-windows-${{ github.run_id }}
          path: ${{ runner.temp }}\hrrr-release\*
          if-no-files-found: error
          retention-days: 14
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hrrr-installer-windows-failure-${{ github.run_id }}
          path: ${{ runner.temp }}\hrrr-packaged-portability
          if-no-files-found: ignore
          retention-days: 7

  release-assets:
    name: Publish proved installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - source
      - security
      - package
      - portable-hosts
      - lifecycle
      - native-acceptance
      - installer-macos
      - installer-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Recover proved installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: hrrr-installer-*-${{ github.run_id }}
          path: dist
          merge-multiple: true
      - name: Publish release and immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "HRRR ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
